version: "3.9"

services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./faiss_index:/data/faiss_index
      - audit_logs:/data
      - ./data/raw_guidelines:/data/raw_guidelines:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  streamlit-ui:
    build:
      context: .
      dockerfile: streamlit_app/Dockerfile
    ports:
      - "8501:8501"
    environment:
      RAG_API_BASE_URL: "http://rag-api:8000/api/v1"
      RAG_API_KEY: "demo-key-123"
    depends_on:
      rag-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  faiss_index:
  audit_logs:
